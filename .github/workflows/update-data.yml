name: Update Data

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/update-data.yml'
  schedule:
    # Run at 9:30 PM UTC (4:30 PM ET) on weekdays — after market close
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      - run: npm run verify

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Update market data $(date -u +%Y-%m-%d)"
          git push

      - name: Wait for GitHub Pages deployment
        run: |
          SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          EXPECTED=$(jq -r .timestamp docs/data.json)
          echo "Waiting for Pages to publish timestamp $EXPECTED at $SITE_URL"

          # A stale deploy also answers HTTP 200, so poll for the timestamp this
          # run just built rather than for mere reachability.
          for i in $(seq 1 30); do
            sleep 10
            LIVE=$(curl -sL -H 'Cache-Control: no-cache' "${SITE_URL}data.js?cb=$(date +%s)" \
              | grep -o '"timestamp":"[^"]*"' | head -1 | cut -d'"' -f4)
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Pages published the new data (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: live timestamp is '${LIVE:-unavailable}', waiting..."
          done

          echo "❌ Pages did not publish $EXPECTED within 5 minutes"
          exit 1

      - name: Verify live site
        run: |
          SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Checking $SITE_URL"
          
          # Fetch the page
          BODY=$(curl -sL --fail "$SITE_URL")
          if [ $? -ne 0 ]; then
            echo "❌ FAILED: Could not fetch site"
            exit 1
          fi
          
          # Check for critical markers. Use a here-string rather than a pipe:
          # `grep -q` exits on first match and would SIGPIPE the writer.
          CHECKS_FAILED=0
          
          if grep -q "renderDashboard" <<< "$BODY"; then
            echo "✓ renderDashboard function present"
          else
            echo "❌ renderDashboard function MISSING"
            CHECKS_FAILED=1
          fi
          
          if grep -q "__FINVIZ_DATA" <<< "$BODY"; then
            echo "✓ __FINVIZ_DATA reference present"
          else
            echo "❌ __FINVIZ_DATA reference MISSING"
            CHECKS_FAILED=1
          fi
          
          if grep -q "squarify" <<< "$BODY"; then
            echo "✓ squarify (treemap) function present"
          else
            echo "❌ squarify function MISSING"
            CHECKS_FAILED=1
          fi
          
          if grep -q "flow-treemap" <<< "$BODY"; then
            echo "✓ flow-treemap CSS present"
          else
            echo "❌ flow-treemap CSS MISSING"
            CHECKS_FAILED=1
          fi
          
          # Check data.js is fetchable and carries the data this run built
          EXPECTED=$(jq -r .timestamp docs/data.json)
          LIVE_DATA=$(curl -sL -H 'Cache-Control: no-cache' "${SITE_URL}data.js?cb=$(date +%s)")
          LIVE=$(grep -o '"timestamp":"[^"]*"' <<< "$LIVE_DATA" | head -1 | cut -d'"' -f4)
          if [ "$LIVE" = "$EXPECTED" ]; then
            echo "✓ data.js serving current timestamp ($LIVE)"
          else
            echo "❌ data.js is stale: expected $EXPECTED, got ${LIVE:-nothing}"
            CHECKS_FAILED=1
          fi
          
          STOCKS=$(jq -r .stockCount docs/data.json)
          if [ "${STOCKS:-0}" -gt 400 ]; then
            echo "✓ stockCount is $STOCKS"
          else
            echo "❌ stockCount is only ${STOCKS:-0}"
            CHECKS_FAILED=1
          fi
          
          if [ $CHECKS_FAILED -ne 0 ]; then
            echo ""
            echo "❌ LIVE SITE VERIFICATION FAILED"
            echo "The site was pushed but is broken. Check the deployment."
            exit 1
          fi
          
          echo ""
          echo "✅ Live site verified successfully"
